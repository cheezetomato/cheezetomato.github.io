<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기 | cheezetomato</title>
<meta name="description" content="숫자를 단서로 지뢰 없는 칸을 모두 여는 지뢰찾기. 네 가지 난이도">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222831'/%3E%3Cpath d='M12 24V8' stroke='%23e9e2d3' stroke-width='2.4'/%3E%3Cpath d='M12 8l11 4-11 4z' fill='%23ff6b5e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="mines-solver.js"></script>
<style>
  :root { --g: #7fb2ff; --g-ink: #0c1420; --steel: #222831; --steel-2: #2b323d; --closed: #3a4350; --closed-hi: #46505f; --open: #1a1f26; --mine: #ff6b5e; --cell: 28px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
  .head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .head h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.04em; margin-right: auto; }
  .device { display: inline-block; max-width: 100%; padding: 14px; border-radius: 16px; background: var(--steel); box-shadow: inset 0 0 0 1px #343c48, 0 30px 60px -30px rgba(0,0,0,0.9); }
  .meters { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .lcd { min-width: 72px; padding: 4px 10px; border-radius: 6px; background: #0d1014; color: var(--mine); font: 800 1.6rem/1.15 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 1px; text-align: center; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); font-variant-numeric: tabular-nums; }
  .meters .btn { white-space: nowrap; min-height: 38px; padding: 6px 14px; background: var(--steel-2); border-color: #414a57; }
  .flagmode[aria-pressed="true"] { border-color: var(--mine); color: #ffd3cd; }
  .boardwrap { overflow: auto; max-width: 100%; border-radius: 6px; }
  .board { display: grid; gap: 2px; width: max-content; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .c { width: var(--cell); height: var(--cell); border-radius: 3px; background: var(--closed); box-shadow: inset 0 2px 0 rgba(255,255,255,0.07), inset 0 -2px 0 rgba(0,0,0,0.18); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--cell) * 0.56); cursor: pointer; line-height: 1; }
  .c:hover { background: var(--closed-hi); }
  .c.o { background: var(--open); box-shadow: none; cursor: default; }
  .c.press { background: #2c333d; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
  .c.start { background: #4a5a7a; color: #cfe0ff; box-shadow: inset 0 0 0 2px #7fb2ff; }
  .c.boom { background: var(--mine); }
  .c.wrong { background: #3a2a2d; }
  .c svg { width: 62%; height: 62%; }
  .n1 { color: #7fb2ff; } .n2 { color: #7fd39b; } .n3 { color: #ff8f84; } .n4 { color: #c9a2ff; } .n5 { color: #ffb86b; } .n6 { color: #6fd7d0; } .n7 { color: #e9e2d3; } .n8 { color: #9aa3ad; }
  .board.pre .c:not(.start) { opacity: 0.55; cursor: not-allowed; }
  .tip { color: var(--text-mute); font-size: 0.86rem; margin: 12px 0 0; }
  .side h2 { margin: 0 0 10px; font-size: 0.9rem; color: var(--text-dim); font-weight: 600; }
  .side section + section { margin-top: 26px; }
  @media (max-width: 560px) { .lcd { min-width: 54px; font-size: 1.25rem; padding: 4px 6px; } .meters { gap: 6px; } .meters .btn { padding: 6px 10px; font-size: 0.88rem; } .device { padding: 10px; } }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .device { display: block; } }
</style>
</head>
<body>
<header class="site-bar"><div class="sb-path"><a class="sb-word" href="./">Games<span class="sb-dot">.</span></a><span class="sb-sep">/</span><span class="sb-here">지뢰찾기</span></div><nav aria-label="사이트 메뉴"><a href="../films/">Films</a><a href="./" aria-current="page">Games</a></nav></header>

<main class="play">
  <div class="layout">
    <div>
      <div class="head">
        <h1>지뢰찾기</h1>
        <div class="seg" role="group" aria-label="난이도" id="diffs"></div>
      </div>
      <div class="device">
        <div class="meters">
          <span class="lcd" id="left" aria-label="남은 지뢰">010</span>
          <button class="btn flagmode" type="button" id="flagmode" aria-pressed="false">깃발 모드</button>
          <button class="btn" type="button" id="reset">새 판</button>
          <span class="lcd" id="clock" aria-label="걸린 시간">000</span>
        </div>
        <div class="boardwrap"><div class="board" id="board" role="grid" aria-label="지뢰찾기 판"></div></div>
      </div>
      <p class="tip">찍지 않고 추리만으로 끝까지 풀 수 있는 판만 나옵니다. 파란 테두리 칸을 눌러 시작하면 그 주변이 한 번에 열립니다. 오른쪽 클릭(휴대폰은 길게 누르기)으로 깃발, 숫자 칸을 누르면 깃발 수가 맞을 때 주변을 한꺼번에 엽니다.</p>
    </div>
    <aside class="side">
      <section>
        <h2>최고 기록 (모두)</h2>
        <table class="records" id="best"><tbody><tr><td class="note">불러오는 중</td></tr></tbody></table>
      </section>
      <section>
        <h2>내 기록 (이 기기)</h2>
        <table class="records" id="mine"></table>
      </section>
    </aside>
  </div>
</main>

<script>
(() => {
  'use strict';
  const { num, dialog, db, toast } = window.Kit;
  const $ = id => document.getElementById(id);
  const DIFF = { '초급': { r: 9, c: 9, m: 10 }, '중급': { r: 16, c: 16, m: 40 }, '고급': { r: 16, c: 30, m: 99 }, '최상급': { r: 24, c: 30, m: 160 } };
  const NAMES = Object.keys(DIFF);
  const FLAG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 17V3" stroke="#e9e2d3" stroke-width="2"/><path d="M6 3l10 4-10 4z" fill="#ff6b5e"/></svg>';
  const MINE = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" fill="#0d1014"/><path d="M10 2v16M2 10h16M4.5 4.5l11 11M15.5 4.5l-11 11" stroke="#0d1014" stroke-width="1.8"/><circle cx="8" cy="8" r="1.6" fill="#fff"/></svg>';

  let diff = '초급', R, C, M, cells = [], first = true, over = false, left = 0, opened = 0, time = 0, timer = 0, flagMode = false, start = null;

  /* ---------- 저장/불러오기 (이 기기) ---------- */
  const saveKey = () => `ms_state_${diff}_noguess`;
  function save() {
    try {
      localStorage.setItem(saveKey(), JSON.stringify({ board: cells.map(row => row.map(x => ({ isMine: x.m, isRevealed: x.o, isFlagged: x.f, neighborMines: x.n }))), isFirstClick: first, isGameOver: over, minesLeft: left, revealedCount: opened, timeElapsed: time }));
      localStorage.setItem('ms_lastConfig', JSON.stringify({ diff }));
    } catch (e) { /* 저장 공간 없음 */ }
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(saveKey()));
      if (!s || !s.board || s.board.length !== R || s.board[0].length !== C) return false;
      cells = s.board.map(row => row.map(x => ({ m: x.isMine, o: x.isRevealed, f: x.isFlagged, n: x.neighborMines })));
      first = s.isFirstClick; over = s.isGameOver; left = s.minesLeft; opened = s.revealedCount; time = s.timeElapsed || 0;
      return true;
    } catch (e) { return false; }
  }

  /* ---------- 판 ---------- */
  function fitCell() {
    const wrap = document.querySelector('.layout > div');
    const avail = Math.max(240, wrap.clientWidth - 30);
    const availH = window.innerHeight - 300;
    let s = Math.floor(Math.min((avail - (C - 1) * 2) / C, (availH - (R - 1) * 2) / R));
    s = Math.max(window.innerWidth < 640 ? 20 : 16, Math.min(32, s));
    document.documentElement.style.setProperty('--cell', `${s}px`);
  }
  function setup(d, fresh) {
    diff = d; ({ r: R, c: C, m: M } = DIFF[d]);
    document.querySelectorAll('#diffs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === d)));
    clearInterval(timer);
    if (fresh || !load()) {
      cells = Array.from({ length: R }, () => Array.from({ length: C }, () => ({ m: false, o: false, f: false, n: 0 })));
      first = true; over = false; left = M; opened = 0; time = 0;
    }
    start = { r: Math.floor(R / 2), c: Math.floor(C / 2) };
    fitCell(); build(); paintAll(); meters();
    if (!first && !over) run();
    save();
  }
  function build() {
    const b = $('board'); b.innerHTML = '';
    b.style.gridTemplateColumns = `repeat(${C}, var(--cell))`;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const el = document.createElement('div');
      el.className = 'c'; el.dataset.r = r; el.dataset.c = c; el.setAttribute('role', 'gridcell');
      b.appendChild(el);
    }
  }
  const elAt = (r, c) => $('board').children[r * C + c];
  const around = (r, c) => { const o = []; for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const nr = r + a, nc = c + b; if ((a || b) && nr >= 0 && nr < R && nc >= 0 && nc < C) o.push([nr, nc]); } return o; };
  function paint(r, c) {
    const x = cells[r][c], el = elAt(r, c);
    el.className = 'c'; el.innerHTML = '';
    if (x.o) {
      el.classList.add('o');
      if (x.m) { el.innerHTML = MINE; if (x.boom) el.classList.add('boom'); }
      else if (x.n) { el.textContent = x.n; el.classList.add(`n${x.n}`); }
    } else if (x.f) {
      el.innerHTML = FLAG; if (over && !x.m) el.classList.add('wrong');
    } else if (over && x.m) { el.classList.add('o'); el.innerHTML = MINE; }
    else if (first && r === start.r && c === start.c) { el.classList.add('start'); el.textContent = '✕'; }
  }
  function paintAll() { for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) paint(r, c); $('board').classList.toggle('pre', first && !over); }
  function meters() {
    $('left').textContent = left < 0 ? `-${String(-left).padStart(2, '0')}` : String(left).padStart(3, '0');
    $('clock').textContent = String(Math.min(999, time)).padStart(3, '0');
  }
  function run() { clearInterval(timer); timer = setInterval(() => { if (time < 999) { time++; meters(); save(); } }, 1000); }

  // 추리만으로 끝까지 풀리는 판을 찾아서 지뢰를 놓음
  let busy = false;
  async function place(fr, fc) {
    busy = true;
    const slow = setTimeout(() => toast('추리로 풀리는 판을 고르는 중입니다…', 4000), 400);
    const res = window.MineGen ? await window.MineGen.generate(R, C, M, fr, fc, { budget: 5000 }) : null;
    clearTimeout(slow);
    const mine = res ? res.mine : window.MineGen ? window.MineGen.randomMines(R, C, M, fr, fc) : null;
    if (mine) for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) cells[r][c].m = !!mine[r * C + c];
    else { let n = 0; while (n < M) { const r = Math.floor(Math.random() * R), c = Math.floor(Math.random() * C); if (cells[r][c].m || (Math.abs(r - fr) <= 1 && Math.abs(c - fc) <= 1)) continue; cells[r][c].m = true; n++; } }
    if (!res) toast('추리로 풀리는 판을 찾지 못해 일반 판으로 시작합니다.', 3000);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) cells[r][c].n = around(r, c).filter(([a, b]) => cells[a][b].m).length;
    busy = false;
  }
  function open(r, c) {
    const st = [[r, c]];
    while (st.length) {
      const [a, b] = st.pop(), x = cells[a][b];
      if (x.o || x.f) continue;
      x.o = true; opened++; paint(a, b);
      if (x.m) { x.boom = true; paint(a, b); return lose(); }
      if (!x.n) around(a, b).forEach(p => st.push(p));
    }
  }
  async function reveal(r, c) {
    if (over || busy) return;
    const x = cells[r][c];
    if (first) {
      if (r !== start.r || c !== start.c) { toast('파란 테두리 칸부터 눌러 주세요.'); return; }
      await place(r, c); first = false; run(); $('board').classList.remove('pre'); paint(r, c);
    }
    if (x.o) {
      // 숫자 칸: 깃발 수가 맞으면 주변 열기
      if (!x.n) return;
      const nb = around(r, c), flags = nb.filter(([a, b]) => cells[a][b].f).length;
      if (flags === x.n) nb.forEach(([a, b]) => { if (!over) open(a, b); });
    } else if (!x.f) open(r, c);
    if (!over && opened === R * C - M) win();
    save();
  }
  function flag(r, c) {
    if (over || first || busy) return;
    const x = cells[r][c]; if (x.o) return;
    x.f = !x.f; left += x.f ? -1 : 1; paint(r, c); meters(); save();
  }
  function lose() { over = true; clearInterval(timer); paintAll(); save(); toast('지뢰를 밟았습니다. 새 판을 눌러 다시 하세요.', 3000); }

  async function win() {
    over = true; clearInterval(timer);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (cells[r][c].m && !cells[r][c].f) { cells[r][c].f = true; }
    left = 0; paintAll(); meters(); save();
    const mineBest = myBest(); const prev = mineBest[diff];
    if (prev == null || time < prev) { mineBest[diff] = time; try { localStorage.setItem('ms_my_best', JSON.stringify(mineBest)); } catch (e) { /* 저장 공간 없음 */ } }
    let msg = prev == null || time < prev ? '이 기기에서 가장 빠른 기록입니다.' : `이 기기 최고 기록은 ${prev}초입니다.`;
    try {
      const d = await db.get('minesweeper_records', diff);
      const best = d && d.noguess;
      if (best == null || time < best) { await db.merge('minesweeper_records', diff, { noguess: time }); msg = `${diff} 전체 최고 기록을 새로 세웠습니다.`; }
    } catch (e) { /* 저장 실패해도 게임은 계속 */ }
    showRecords();
    dialog({ title: `${time}초 만에 성공`, text: `${diff}. ${msg}`, actions: [{ label: '닫기' }, { label: '새 판', main: true, onClick: () => setup(diff, true) }] });
  }

  /* ---------- 입력: 마우스와 터치 ---------- */
  const board = $('board');
  let down = null, pressed = [], longT = 0, longFired = false;
  const cellOf = e => { const el = e.target.closest('.c'); return el ? [+el.dataset.r, +el.dataset.c] : null; };
  function press(rc) {
    pressed.forEach(el => el.classList.remove('press')); pressed = [];
    if (!rc || over) return;
    const [r, c] = rc, x = cells[r][c];
    const list = x.o ? around(r, c) : [[r, c]];
    list.forEach(([a, b]) => { const y = cells[a][b]; if (!y.o && !y.f) { const el = elAt(a, b); el.classList.add('press'); pressed.push(el); } });
  }
  board.addEventListener('contextmenu', e => e.preventDefault());
  board.addEventListener('pointerdown', e => {
    const rc = cellOf(e); if (!rc) return;
    if (e.button === 2) { flag(...rc); return; }
    if (e.button !== 0) return;
    down = rc; longFired = false; press(rc);
    if (e.pointerType !== 'mouse') {
      clearTimeout(longT);
      longT = setTimeout(() => { longFired = true; press(null); if (navigator.vibrate) navigator.vibrate(15); flag(...rc); }, 380);
    }
  });
  board.addEventListener('pointermove', e => {
    if (!down) return;
    if (e.pointerType !== 'mouse') return;
    const rc = cellOf(e); press(rc); down = rc;
  });
  window.addEventListener('pointerup', e => {
    clearTimeout(longT);
    if (!down) return;
    const rc = e.pointerType === 'mouse' ? cellOf(e) : down; down = null; press(null);
    if (!rc || longFired) return;
    if (flagMode && !cells[rc[0]][rc[1]].o) flag(...rc); else reveal(...rc);
  });
  board.addEventListener('pointercancel', () => { clearTimeout(longT); down = null; press(null); });

  $('reset').addEventListener('click', () => setup(diff, true));
  $('flagmode').addEventListener('click', () => { flagMode = !flagMode; $('flagmode').setAttribute('aria-pressed', String(flagMode)); });
  $('diffs').innerHTML = NAMES.map(n => `<button type="button" data-d="${n}" aria-pressed="false">${n}</button>`).join('');
  $('diffs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { if (b.dataset.d !== diff) { save(); setup(b.dataset.d, false); } }));
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitCell, 120); });

  /* ---------- 기록 ---------- */
  function myBest() { try { return JSON.parse(localStorage.getItem('ms_my_best')) || {}; } catch (e) { return {}; } }
  async function showRecords() {
    const mb = myBest();
    $('mine').innerHTML = `<tbody>${NAMES.map(n => `<tr><td>${n}</td><td>${mb[n] != null ? `<b>${num(mb[n])}초</b>` : '<span class="when">-</span>'}</td></tr>`).join('')}</tbody>`;
    try {
      const all = await db.list('minesweeper_records');
      const by = Object.fromEntries(all.map(d => [d.id, d.noguess]));
      $('best').innerHTML = `<tbody>${NAMES.map(n => `<tr class="${n === diff ? 'top' : ''}"><td>${n}</td><td>${by[n] != null ? `<b>${num(by[n])}초</b>` : '<span class="when">아직 없음</span>'}</td></tr>`).join('')}</tbody>`;
    } catch (e) { $('best').innerHTML = '<tbody><tr><td class="note">기록을 불러오지 못했습니다.</td></tr></tbody>'; }
  }

  let last = '초급';
  try { last = (JSON.parse(localStorage.getItem('ms_lastConfig')) || {}).diff || '초급'; } catch (e) { /* 기본값 */ }
  setup(DIFF[last] ? last : '초급', false);
  showRecords();
  window.MsTest = { get cells() { return cells; }, reveal, flag, get state() { return { over, opened, first }; } };
})();
</script>
</body>
</html>

name: 영화 기록 백업

on:
  schedule:
    - cron: "43 17 * * 0"   # 매주 월요일 02:43 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 백업 브랜치 준비
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backup >/dev/null; then
            git fetch --depth=1 origin backup
            git worktree add backup-tree FETCH_HEAD
            git -C backup-tree switch -c backup
          else
            git worktree add --detach backup-tree
            git -C backup-tree switch --orphan backup
          fi

      - name: 기록 받기
        run: python3 .github/scripts/backup_movies.py backup-tree/movies_backup.json

      - name: 바뀐 내용이 있으면 저장
        working-directory: backup-tree
        run: |
          git add movies_backup.json
          if git diff --cached --quiet; then
            echo "지난 백업과 같아서 저장하지 않습니다."
          else
            git commit -m "Back up movie records $(TZ=Asia/Seoul date +%F)"
            git push origin backup
          fi
